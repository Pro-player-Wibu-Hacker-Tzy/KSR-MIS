<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSR-MIS - Informasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Manajemen Informasi</h1>

        <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline" id="error-text"></span>
        </div>

        <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-6">
            <h2 id="form-title" class="text-xl font-semibold mb-4 text-gray-700">Tambah Informasi</h2>
            <form id="data-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="data-id">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="judul">Judul</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="judul" type="text" required>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="tanggal">Tanggal</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="tanggal" type="date" required>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="kategori">Kategori</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="kategori" type="text" required>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="isi">Isi</label>
                    <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="isi" rows="3" required></textarea>
                </div>
                <div class="flex items-end space-x-2 md:col-span-2">
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full md:w-auto">
                        Simpan
                    </button>
                    <button type="button" id="cancel-btn" class="hidden bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full md:w-auto" onclick="resetForm()">
                        Batal
                    </button>
                </div>
            </form>
        </div>

        <div id="loading" class="hidden text-center text-blue-500 font-bold mb-4">Memuat data...</div>

        <div class="bg-white shadow-md rounded overflow-hidden">
            <table class="min-w-full bg-white">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="py-2 px-4 text-left">ID</th>
                        <th class="py-2 px-4 text-left">Judul</th>
                        <th class="py-2 px-4 text-left">Isi</th>
                        <th class="py-2 px-4 text-left">Tanggal</th>
                        <th class="py-2 px-4 text-left">Kategori</th>
                        <th class="py-2 px-4 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="text-gray-700">
                </tbody>
            </table>
        </div>
    </div>

    <script src="../js/informasi.js"></script>
</body>
</html>
